apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

android {
    namespace "com.attendance.name"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.attendance.name"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        versionCode 48 // ✅ Increment for new Play Store upload
        versionName "1.6.2"

        multiDexEnabled true
        
        // ✅ ADD THIS: Enable 16KB page size support
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    // ✅ ADD THIS: Split APKs by ABI for 16KB support
    splits {
        abi {
            reset()
            enable true
            universalApk true  // Also generate a universal APK
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    // 🔐 SIGNING CONFIGS
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile file("my-upload-key.keystore")
            storePassword "123456789"
            keyAlias "my-key-alias"
            keyPassword "123456789"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // ✅ UPDATED: Better packaging options for 16KB support
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        
        // Add these to handle duplicate files properly
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        
        // Exclude duplicate license files
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // ✅ CRITICAL: Use Kotlin 1.9.24 BOM (fixes Android 15 removeFirst/removeLast issue)
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.24"))
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    // Explicitly declare Kotlin stdlib with correct version
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")

    // TensorFlow Lite
    implementation("org.tensorflow:tensorflow-lite:2.14.0")
    implementation("org.tensorflow:tensorflow-lite-gpu:2.14.0")
    implementation("org.tensorflow:tensorflow-lite-support:0.4.4")

    // ML Kit Face Detection
    implementation("com.google.mlkit:face-detection:16.1.5")

    // Multidex
    implementation("androidx.multidex:multidex:2.0.1")
}

// ✅ FORCE Kotlin 1.9.24 everywhere (prevents transitive dependency issues)
configurations.all {
    resolutionStrategy {
        force("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")
        force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24")
        force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24")
        force("org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24")
    }
}

// MUST BE LAST
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

applyNativeModulesAppBuildGradle(project)